[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "strix"
version = "0.1.0"
description = "Physically modelled 3D views of binary star evolution"
authors = [{ name = "Akhil Nair" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sailfish = ["h5py>=3"]
test = ["pytest>=8", "h5py>=3"]

[project.scripts]
strix = "strix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strix"]

[tool.ruff]
line-length = 100
