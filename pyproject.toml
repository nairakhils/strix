[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "strix"
version = "0.1.0"
description = "Physically modelled 3D views of binary star evolution"
authors = [{ name = "Akhil Nair" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/strix"]

[tool.ruff]
line-length = 100
